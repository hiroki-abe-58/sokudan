[project]
name = "sokudan"
version = "0.1.0.dev0"
description = "Japanese System One decision model: typed answers + calibrated probabilities in a single forward pass, no text generation."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "hiroki-abe-58" }]
keywords = ["japanese", "nlp", "modernbert", "calibration", "system-one", "encoder"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "torch>=2.8",
  "transformers>=4.48.0",
  "tokenizers>=0.21",
  "pydantic>=2.7",
  "numpy>=1.26",
  "datasets>=3.0",
  "fugashi>=1.3",
  "unidic-lite>=1.0.8",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]
serve = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
# Baseline comparison only (docs/baseline_ja.md). Not needed to train or serve sokudan.
bench = [
  "laya>=0.1",
  "scikit-learn>=1.5",
]

[project.urls]
Homepage = "https://github.com/hiroki-abe-58/sokudan"
Repository = "https://github.com/hiroki-abe-58/sokudan"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sokudan"]

# --- uv: RTX 5090 is Blackwell (sm_120). CUDA 12.8+ wheels are mandatory.
# The cu126 build on this machine reports arch_list without sm_120 and fails with
# "no kernel image is available for execution on the device" (measured 2026-09-20).
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "gpu: requires a CUDA device",
  "slow: takes more than a few seconds",
  "network: requires network access",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
