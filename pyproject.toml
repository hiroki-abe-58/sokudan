[project]
name = "sokudan"
version = "0.2.1"
description = "Japanese System One decision model: typed answers + probabilities in a single forward pass, no text generation."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "hiroki-abe-58" }]
keywords = ["japanese", "nlp", "modernbert", "calibration", "system-one", "encoder", "classification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: Japanese",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]

# Upper bounds are the next major version above what uv.lock resolves today; the
# lower bounds are the ones the code has been developed against.
dependencies = [
  "torch>=2.8,<3",
  "transformers>=4.48.0,<6",
  "tokenizers>=0.21,<1",
  # Imported directly by sokudan.predict (Hub download, safetensors weights). They
  # came in through transformers before; declared so the dependency is not implicit.
  "huggingface-hub>=0.24,<2",
  "safetensors>=0.4,<1",
  "pydantic>=2.7,<3",
  "numpy>=1.26,<3",
  "datasets>=3.0,<6",
  "fugashi>=1.3,<2",
  "unidic-lite>=1.0.8,<2",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "tqdm>=4.66,<5",
  "matplotlib>=3.8,<4",
  "rich>=13.7,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "pytest-cov>=5.0",
]
# `sokudan serve`: the /v1/systemone-compatible server (docs/serving.md).
serve = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
# The MLX backend on Apple silicon (docs/mlx.md). 0.32.2 is the only MLX version it has
# been run with.
mlx = [
  "mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# The Gradio demo in spaces/demo/.
demo = [
  "gradio>=5.0,<7",
]
# Baseline comparison only (docs/baseline_ja.md). Not needed to train or serve sokudan.
bench = [
  "laya>=0.1",
  "scikit-learn>=1.5",
]

[project.scripts]
sokudan = "sokudan.cli:main"

[project.urls]
Homepage = "https://github.com/hiroki-abe-58/sokudan"
Repository = "https://github.com/hiroki-abe-58/sokudan"
Documentation = "https://github.com/hiroki-abe-58/sokudan/blob/main/docs/serving.md"
Changelog = "https://github.com/hiroki-abe-58/sokudan/blob/main/CHANGELOG.md"
Model = "https://huggingface.co/GeneLab/sokudan-ja-310m"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sokudan"]

# The sdist carries the package, its tests and the documents the package needs to
# make sense. Not the research scripts, generated data, docs images or uv.lock.
[tool.hatch.build.targets.sdist]
include = [
  "/sokudan/",
  "/tests/",
  "/README.md",
  "/README_ja.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
  "/pyproject.toml",
]

# --- uv: RTX 5090 is Blackwell (sm_120). CUDA 12.8+ wheels are mandatory.
# The cu126 build on this machine reports arch_list without sm_120 and fails with
# "no kernel image is available for execution on the device" (measured 2026-09-20).
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "gpu: requires a CUDA device",
  "slow: takes more than a few seconds",
  "network: requires network access",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
