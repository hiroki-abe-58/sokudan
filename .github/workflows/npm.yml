name: npm

on:
  pull_request:
    paths: ['packages/npm/**', '.github/workflows/npm.yml', 'sokudan/serve/**', 'tests/test_systemone_server.py', 'pyproject.toml', 'LICENSE', 'NOTICE']
  push:
    branches: [main]
    tags: ['npm-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/npm/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run

  integration:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ".[serve]" pytest
      - run: npm ci && npm run build
        working-directory: packages/npm
      - name: Test SDK against the Python HTTP server
        env:
          SOKUDAN_TEST_PYTHON: python
        run: node scripts/check-python-server.mjs
        working-directory: packages/npm

  publish:
    if: startsWith(github.ref, 'refs/tags/npm-v')
    needs: [test, integration]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install --global npm@11
      - run: npm ci
      - name: Check tag and Python release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs
      - run: npm publish --provenance --access public
